id: T1
name: Credential Content Tampering
elements: [P3, F2, S2, F3, P10, C2]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Tampering
description: >-
  An attacker with access to a [=verifiable credential=] after it is
  [=P3|issued=] modifies its contents to alter the [=claims=] it expresses.
  The attacker can act while the credential is being [=F2|delivered to the holder=],
  while it is at rest in [=S2|holder storage=], or while it is being
  [=F3|exchanged with a verifier=] inside a [=verifiable presentation=]. For
  example, an attacker might change the [=subject=] of a degree credential,
  alter a date of birth used for age verification, or add statements the
  [=E1|issuer=] did not make. In a related variant, the attacker removes the
  securing mechanism from the credential in hopes that a downstream [=P10|verify=]
  process will consume it without detecting that its integrity protection is
  absent. Allowing a [=E3|verifier=] to detect modification of credential
  content is a capability the Verifiable Credentials Data Model is designed
  to provide.
response:
  - id: R1
    name: Securing Mechanism Verification
    type: Reduce
    description: >-
      The [=P10|Verify Presentation=] process cryptographically verifies a
      securing mechanism (such as [[[VC-DATA-INTEGRITY]]] or
      [[[VC-JOSE-COSE]]]) protecting each [=verifiable credential=] against the
      [=E1|issuer's=] public verification material. Any modification of
      the protected claims causes verification to fail. Verification detects
      tampering; it does not prevent it. A [=E3|verifier=] that does not
      verify the securing mechanism, or that acts on [=credentials=] whose
      proofs it has not checked, gains no protection from this response.
  - id: R2
    name: Reject Credentials Lacking Required Proofs
    type: Reduce
    description: >-
      Proof stripping cannot be detected by cryptographic means, because a
      credential with no proof contains nothing to verify. [=E3|Verifiers=]
      address this through policy. They reject any [=verifiable credential=]
      that does not carry the securing mechanism their policy requires, and
      they treat unsecured [=credentials=] as unauthenticated statements made by the presenting holder, rather than
      as authenticated statements made by the [=E1|issuer=].
