id: T2
name: Code Injection via Credential Content
elements: [F2, S2, P10, P12, C3]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Elevation of Privilege
description: >-
  A [=verifiable credential=] can carry values that contain injectable code,
  such as markup in an <code>rdf:HTML</code> value or content in a scripting
  language, added during the data production process. A consumer that
  processes such content without adequate handling can be made to execute the
  injected code. For example, a <code>script</code> tag can run when the
  credential is displayed. The consumer is most often a [=E3|verifier=]
  rendering a credential during [=P10|Verify Presentation=] or
  [=P12|Validate Credential(s)=]. It can also be a [=E2|holder=]'s wallet
  displaying a credential retrieved from [=S2|holder storage=]. A valid
  securing mechanism protects the integrity of the embedded content but does
  not indicate whether the content is safe, so malicious code can arrive inside a
  well-formed, verified credential. The specification leaves the choice of
  mitigation to implementers.
response:
  - id: R1
    name: Avoid Embedding Executable Markup
    type: Eliminate
    description: >-
      Authors of [=verifiable credentials=] avoid including HTML or other
      markup languages that can carry executable scripts unless a specific
      use case requires it. Language and base direction are expressed through
      the data model's own mechanisms rather than through embedded markup.
      When no executable content is present, the injection vector is removed
      at the source.
  - id: R2
    name: Sandboxed Rendering and Output Encoding
    type: Reduce
    description: >-
      When markup that can contain executable content must be processed,
      implementers analyze how an attacker could use it to mount an injection
      attack against the consumer, and deploy mitigations before processing
      the content. Examples include rendering untrusted content in a sandbox with no
      network access, applying context-appropriate output encoding, and
      treating all credential-delivered content as untrusted whether or not its
      securing mechanism was successfully verified.
