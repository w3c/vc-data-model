# Registry for the Verifiable Credentials Data Model threat model.
#
# This file defines:
#   - categories: the threat categories (from the W3C Threat Modeling
#     Guide) and the threat definition files belonging to each, in display
#     order, resolved relative to this file's directory;
#   - elements:   display labels for the data flow diagram elements
#     defined in the Dictionary section of index.html.
#
# Threat IDs are not stored anywhere. Each threat is numbered T1, T2, ... by
# its position when the categories below are walked in order, so reordering
# the lists renumbers the model. Anchors are derived from each threat's name
# rather than its number, so renumbering does not break inbound links.
#
# To add a threat: create a new YAML file following the pattern of the
# Data Integrity threat model's threat files, name it after the threat, and
# add its filename to the appropriate category below.

categories:
  - name: Target Threats
    id: threat-model-target-threats
    threats:
      - credential-content-tampering.yaml
      - identity-proofing-failure-at-issuance.yaml
  - name: Implementation Threats
    id: threat-model-implementation-threats
    threats:
      - code-injection-via-credential-content.yaml
      - signature-based-correlation.yaml
      - correlation-via-status-and-revocation-lookup.yaml
      - signing-key-compromise-and-mismanagement.yaml
      - tampering-with-unprotected-external-resources.yaml
      - presentation-exchange-attacks-mitm-replay-and-spoofing.yaml
      - inappropriate-or-out-of-context-credential-use.yaml
  - name: Deployment Threats
    id: threat-model-deployment-threats
    threats:
      - identifier-based-correlation.yaml
      - untrustworthy-user-agent-software.yaml
      - excessive-data-disclosure.yaml
      - metadata-based-correlation.yaml
      - bearer-credential-reuse-and-correlation.yaml
      - correlation-via-patterns-of-use.yaml
      - disclosure-to-a-malicious-or-deceptive-verifier.yaml
      - data-theft-and-credential-honeypots.yaml
      - issuer-side-correlation-and-privacy-subversion.yaml
      - inappropriate-validity-periods.yaml
      - device-theft-and-impersonation.yaml
  - name: External Threats
    id: threat-model-external-threats
    threats:
      - storage-provider-data-mining-and-compelled-disclosure.yaml
      - device-tracking-and-fingerprinting.yaml
      - credential-and-data-aggregation.yaml
      - unauthorized-post-presentation-use-of-data.yaml
  - name: Dependency Threats
    id: threat-model-dependency-threats
    threats:
      - cryptographic-suite-obsolescence.yaml

elements:
  E1: "E1: Issuer"
  E2: "E2: Holder"
  E3: "E3: Verifier"
  P1: "P1: Establish Confidence"
  P2: "P2: Assemble Verifiable Credential"
  P3: "P3: Issue Verifiable Credential"
  P4: "P4: Publish Status List"
  P5: "P5: Update Status List"
  P6: "P6: Store Verifiable Credential"
  P7: "P7: Engage in Workflow (Holder)"
  P8: "P8: Generate Presentation"
  P9: "P9: Engage in Workflow (Verifier)"
  P10: "P10: Verify Presentation"
  P11: "P11: Verify Credential Status"
  P12: "P12: Validate Credential(s)"
  F1: "F1: Establish Confidence in Subject"
  F2: "F2: Deliver Verifiable Credential"
  F3: "F3: Exchange Presentation"
  F4: "F4: Check Credential Status"
  S1: "S1: Status List Storage"
  S2: "S2: Holder Storage"
  C1: "C1: Issuer System"
  C2: "C2: Holder System"
  C3: "C3: Verifier System"
