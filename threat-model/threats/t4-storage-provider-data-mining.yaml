id: T4
name: Storage Provider Data Mining and Compelled Disclosure
elements: [E2, P6, S2]
tags: [privacy]
taxonomyName: STRIDE
taxonomyClass: Information Disclosure
description: >-
  When a [=E2|holder=] uses a third-party service to
  [=P6|store verifiable credentials=], the contents of [=S2|holder storage=]
  are exposed to the service operator. The information in a
  [=verifiable credential=] can be sensitive and highly individualized, which
  makes it a target for data mining. A service offered at no charge can mine
  this personal data and sell it to organizations that build profiles of
  people and organizations. The same stored data can also be disclosed to
  authorities through legal processes that compel [=issuers=], [=holders=],
  or [=verifiers=], or through a software bug or security failure. These are
  real-world risks that arise from the operating environment and the choice
  of service provider, and they are outside the scope of what the data model
  itself can control.
response:
  - id: R1
    name: Local or Encrypted Storage
    type: Reduce
    description: >-
      [=Holders=] reduce exposure by using software that stores
      [=verifiable credentials=] locally on a device they control, or that
      encrypts [=credentials=] so the storage provider cannot read their
      contents. This limits both data mining by the provider and the
      information available for compelled disclosure. It does not address
      disclosure compelled directly from the [=holder=].
  - id: R2
    name: Provider Selection and External Oversight
    type: Transfer
    description: >-
      [=Holders=] review the terms of service of a [=credential repository=]
      for its correlation and data-mining protections, and choose providers
      that do not sell information to third parties. Civil society and
      regulatory participation in vendor analysis and auditing, together with
      transparency and subject-notification requirements in legal and
      compliance regimes, place responsibility for these risks on the parties
      that operate the services and the processes.
  - id: R3
    name: Accept Residual Environmental Risk
    type: Accept
    description: >-
      Compelled disclosure through lawful legal process, and the residual
      risk that a provider or process behaves contrary to a [=holder=]'s
      interests, cannot be removed by the data model. This portion of the
      threat is acknowledged and accepted as outside the scope of the
      specification.
