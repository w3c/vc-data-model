# Verifiable Credentials Vocabulary v2.1
# See https://www.w3.org/TR/vc-data-model-2.1/ for the official specification
#
# A note on external definitions: they are added here to be included in the generated VCDM JSON-LD context file.
# The terms do not appear in the TTL/JSON-LD versions of the vocabulary, and are removed from the HTML output
#

json_ld:
  protected: true
  alias:
    id: "@id"
    type: "@type"

vocab:
  - id: cred
    value: https://www.w3.org/2018/credentials#
    context: https://www.w3.org/ns/credentials/v2.1r1

prefix:
  - id: sch
    value: https://schema.org/

  - id: bsl
    value: https://www.w3.org/ns/credentials/status#

  - id: sec
    value: https://w3id.org/security#

  - id: jwt
    value: https://www.iana.org/assignments/jwt#

  - id: jose
    value: https://www.iana.org/assignments/jose#

ontology:
  - property: dc:title
    value: Verifiable Credentials Vocabulary v2.1

  - property: dc:description
    value: RDFS [[RDF-SCHEMA]] vocabulary used by the Verifiable Credentials [[vc-data-model-2.1]]

  - property: rdfs:seeAlso
    value: https://www.w3.org/TR/vc-data-model-2.1/

class:
  - id: CredentialEvidence
    label: Credential evidence
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-credential-evidence
    context: none

  - id: CredentialSchema
    label: Credential schema
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-credential-schema
    context: none

  - id: CredentialStatus
    label: Credential status
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-credential-status
    context: none

  - id: ConfidenceMethod
    label: Confidence method
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-confidence-method
    status: reserved
    context: none

  - id: EnvelopedVerifiableCredential
    label: Enveloped verifiable credential
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-EnvelopedVerifiableCredential

  - id: EnvelopedVerifiablePresentation
    label: Enveloped verifiable presentation
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-EnvelopedVerifiablePresentation

  - id: JsonSchema
    label: JSON schema validator
    defined_by: https://www.w3.org/TR/vc-json-schema/#jsonschema
    upper_value: cred:CredentialSchema

  - id: JsonSchemaCredential
    label: JSON schema validator with schema contained in a credential
    defined_by: https://www.w3.org/TR/vc-json-schema/#jsonschemacredential
    upper_value: cred:VerifiableCredential

  - id: RefreshService
    label: Refresh service
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-refresh-service
    context: none

  - id: RenderMethod
    label: Render method
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-render-method
    status: reserved
    context: none

  - id: TermsOfUse
    label: Terms of use
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#vc-terms-of-use
    context: none

  - id: VerifiableCredential
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#credentials
    label: Verifiable credential

  - id: VerifiableCredentialGraph
    label: Verifiable credential graph
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#dfn-verifiablecredentialgraph
    comment: Instances of this class are <a href="https://www.w3.org/TR/rdf12-concepts/#section-rdf-graph">RDF Graphs</a> [[RDF12-CONCEPTS]].
    context: none

  - id: VerifiablePresentation
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#presentations
    label: Verifiable presentation

# External class definitions used to enrich the json-ld context
  - id: sec:DataIntegrityProof
    label: Data Integrity Proof

  - id: bsl:BitstringStatusListCredential
    label: Bitstring Status List Credential
    html_class: ["hidden"]

  - id: bsl:BitstringStatusList
    label: Bitstring Status List
    html_class: ["hidden"]

  - id: bsl:BitstringStatusListEntry
    label: Bitstring Status List Entry
    html_class: ["hidden"]

  - id: bsl:BitstringStatusMessage
    label: Bitstring status message class
    html_class: ["hidden"]
    context: none

  - id: sec:VerificationRelationship
    label: Verification Relationship
    html_class: ["hidden"]

# This class is used to "bridge" some JWT-specific, property-scoped contexts
# It is an artefact rather than a real RDF class
  - id: jwt:Cnf
    label: JWT confirmation class
    html_class: ["hidden"]
    context: none

property:
  - id: credentialSchema
    label: Credential schema
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-credentialSchema
    domain: cred:VerifiableCredential
    range: cred:CredentialSchema

  - id: credentialStatus
    label: Credential status
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-credentialStatus
    domain: cred:VerifiableCredential
    range: cred:CredentialStatus

  - id: confidenceMethod
    label: Confidence method
    defined_by: https://w3c-ccg.github.io/confidence-method-spec/
    range: cred:ConfidenceMethod

  - id: credentialSubject
    label: Credential subject
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-credentialSubject
    domain: cred:VerifiableCredential
    range: IRI

  - id: digestSRI
    label: Subresource integrity digest
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-digestSRI
    range: cred:sriString
    see_also:
      - label: Subresource Integrity Metadata
        url:  https://www.w3.org/TR/SRI/#the-integrity-attribute

  - id: evidence
    label: Evidence
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-evidence
    domain: cred:VerifiableCredential
    range: cred:CredentialEvidence

  - id: expirationDate
    label: Expiration date
    defined_by: https://www.w3.org/TR/2022/REC-vc-data-model-20220303/#expiration
    range: xsd:dateTime
    deprecated: true
    comment: The value of this property was used in the past to express the date and time the credential ceased to be valid. It has been deprecated in favor of <a href="#validUntil">validUntil</a>

  - id: holder
    label: Holder
    domain: cred:VerifiablePresentation
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-holder
    range : IRI

  - id: jsonSchema
    label: Referring to a Json Schema
    domain: cred:JsonSchema
    range: rdf:JSON
    defined_by: https://www.w3.org/TR/vc-json-schema/#jsonschema-0

  - id: issuanceDate
    label: Issuance date
    defined_by: https://www.w3.org/TR/2022/REC-vc-data-model-20220303/#issuance-date
    range: xsd:dateTime
    deprecated: true
    comment: The value of this property was used in the past to represent the earliest date when the information associated with the <a href="#credentialSubject">credentialSubject</a> property became valid. This property has been deprecated in favor of <a href="#validFrom">validFrom</a>.

  - id: issuer
    label: Issuer
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-issuer
    domain: cred:VerifiableCredential
    range: IRI

  - id: refreshService
    label: Refresh service
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-refreshService
    domain: cred:VerifiableCredential
    range: cred:RefreshService

  - id: renderMethod
    label: Render method
    domain: cred:VerifiableCredential
    defined_by: https://w3c-ccg.github.io/vc-render-method/#the-rendermethod-property
    range: cred:RenderMethod

  - id: relatedResource
    label: Related resource
    domain: cred:VerifiableCredential
    range: IRI
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-relatedResource

  - id: termsOfUse
    label: Terms of use
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-termsOfUse
    domain: [cred:VerifiableCredential, cred:VerifiablePresentation]
    range: cred:TermsOfUse

  - id: validFrom
    label: Valid from
    scope: [cred:VerifiableCredential, cred:VerifiablePresentation]
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-validFrom
    range: xsd:dateTime

  - id: validUntil
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-validUntil
    label: Valid until
    scope: [cred:VerifiableCredential, cred:VerifiablePresentation]
    range: xsd:dateTime

  - id: verifiableCredential
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#defn-verifiableCredential
    label: Verifiable credential graph
    domain: cred:VerifiablePresentation
    range: cred:VerifiableCredentialGraph
    dataset: true

# External property definitions use to enrich the JSON-LD context

# External property definitions: schema.org terms (using https)
  - id: sch:description
    label: Schema.org description
    scope: [VerifiableCredential,vocab]

  - id: sch:encodingFormat
    label: Schema.org media type
    known_as: mediaType

  - id: sch:name
    label: Schema.org name
    scope: [VerifiableCredential,vocab]

# External property definitions: security vocabulary
  - id: sec:digestMultibase
    label: Digest multibase
    range: sec:multibase

  - id: sec:challenge
    label: Proof challenge
    domain: sec:DataIntegrityProof
    html_class: ["hidden"]

  - id: sec:expires
    label: Expires
    defined_by: https://w3id.org/security#expires
    domain: sec:DataIntegrityProof
    range: xsd:dateType
    html_class: ["hidden"]

  - id: sec:proof
    label: Proof
    range: URL
    dataset: true
    scope: [VerifiableCredential, VerifiablePresentation]

  - id: sec:created
    label: Created
    scope: sec:DataIntegrityProof
    range: xsd:dateTime
    html_class: ["hidden"]

  - id: sec:cryptosuite
    label: Cryptosuite reference
    scope: sec:DataIntegrityProof
    range: sec:cryptosuiteString
    html_class: ["hidden"]

  - id: sec:domain
    label: Proof domain
    scope: sec:DataIntegrityProof
    html_class: ["hidden"]

  - id: sec:nonce
    label: Nonce
    scope: sec:DataIntegrityProof
    html_class: ["hidden"]

  - id: sec:previousProof
    label: Previous proof
    scope: sec:DataIntegrityProof
    range: URL
    html_class: ["hidden"]

  - id: sec:proofPurpose
    label: Proof purpose
    scope: sec:DataIntegrityProof
    range: sec:VerificationRelationship
    html_class: ["hidden"]

  - id: sec:proofValue
    label: Proof value
    scope: sec:DataIntegrityProof
    range: sec:multibase
    html_class: ["hidden"]

  - id: sec:verificationMethod
    label: Verification method
    scope: sec:DataIntegrityProof
    range: URL
    html_class: ["hidden"]

  - id: sec:assertionMethod
    label: Assertion method
    scope: sec:VerificationRelationship
    range: URL
    container: "set"
    html_class: ["hidden"]

  - id: sec:authentication
    label: Authentication
    scope: sec:VerificationRelationship
    range: URL
    container: "set"
    html_class: ["hidden"]

  - id: sec:capabilityDelegation
    label: Capability delegation
    scope: sec:VerificationRelationship
    range: URL
    container: "set"
    html_class: ["hidden"]

  - id: sec:capabilityInvocation
    label: Capability invocation
    scope: sec:VerificationRelationship
    range: URL
    container: "set"
    html_class: ["hidden"]

  - id: sec:keyAgreement
    label: Key agreement
    scope: sec:VerificationRelationship
    range: URL
    container: "set"
    html_class: ["hidden"]

# External property definitions: Bitstring status list terms
  - id: bsl:encodedList
    label: Encoded list
    scope: bsl:BitstringStatusList
    range: sec:multibase
    html_class: ["hidden"]

  - id: bsl:statusPurpose
    label: Bitstring Status Purpose
    scope: bsl:BitstringStatusList
    html_class: ["hidden"]

  - id: bsl:ttl
    label: Time to live in miliseconds
    scope: bsl:BitstringStatusList
    html_class: ["hidden"]

  - id: bsl:statusListCredential
    label: Status list credential
    scope: bsl:BitstringStatusListEntry
    range: bsl:BitstringStatusListCredential
    html_class: ["hidden"]

  - id: bsl:statusListIndex
    label: Status list index
    scope: bsl:BitstringStatusListEntry
    html_class: ["hidden"]

  - id: bsl:statusListPurpose
    label: Status list purpose
    scope: bsl:BitstringStatusListEntry
    html_class: ["hidden"]

  - id: bsl:statusMessage
    label: Status message
    scope: bsl:BitstringStatusListEntry
    range: bsl:BitstringStatusMessage
    property_scope: bsl:BitstringStatusMessage
    html_class: ["hidden"]

  - id: bsl:message
    label: Message
    scope: bsl:BitstringStatusMessage
    html_class: ["hidden"]

  - id: bsl:status
    label: Status
    scope: bsl:BitstringStatusMessage
    html_class: ["hidden"]

  - id: bsl:statusReference
    label: Status reference
    scope: bsl:BitstringStatusListEntry
    range: URL
    html_class: ["hidden"]

  - id: bsl:statusSize
    label: Status size
    scope: bsl:BitstringStatusListEntry
    range: xsd:integer
    html_class: ["hidden"]

# External property definitions: JWT/JOSE
  - id: jwt:...
    label: JWT digest of disclosure
    html_class: ["hidden"]

  - id: jwt:_sd
    label: JWT array of digests
    range: rdf:JSON
    html_class: ["hidden"]

  - id: jwt:_sd_alg
    label: JWT hash algorithm
    html_class: ["hidden"]

  - id: jwt:aud
    label: JWT audience
    range: URL
    html_class: ["hidden"]

  - id: jwt:cnf
    label: JWT confirmation
    range: jwt:Cnf
    property_scope: jwt:Cnf
    html_class: ["hidden"]

  - id: jwt:exp
    label: JWT expiration time
    range: xsd:nonNegativeInteger
    html_class: ["hidden"]

  - id: jwt:iat
    label: JWT issued at
    range: xsd:nonNegativeInteger
    html_class: ["hidden"]

  - id: jose:iss
    label: JWT issuer
    range: URL
    html_class: ["hidden"]

  - id: jose:jku
    label: JWT set URL
    range: URL
    html_class: ["hidden"]

  - id: jwt:kid
    label: JWT key ID
    domain: jwt:Cnf
    range: URL
    html_class: ["hidden"]

  - id: jwt:jwk
    label: JWT embedded public key
    domain: jwt:Cnf
    range: rdf:JSON
    html_class: ["hidden"]

  - id: jwt:nbf
    label: JWT not before
    range: xsd:nonNegativeInteger
    html_class: ["hidden"]

  - id: jose:sub
    label: JWT subject
    range: URL
    html_class: ["hidden"]

  - id: jose:x5u
    label: JWT X.509 URL
    range: URL
    html_class: ["hidden"]

datatype:
  - id: sriString
    label: Datatype for digest SRI values
    upper_value: xsd:string
    defined_by: https://www.w3.org/TR/vc-data-model-2.1/#the-sristring-datatype
    see_also:
      - label: Subresource Integrity Metadata
        url:  https://www.w3.org/TR/SRI/#the-integrity-attribute

  - id: sec:multibase
    label: Datatype for digest values
    upper_value: xsd:string

  - id: sec:cryptosuiteString
    label: Datatype for cryptosuite Identifiers
    upper_value: xsd:string
    html_class: ["hidden"]
