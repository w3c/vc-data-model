name: Publish W3C Specification Working Draft
on:
  push:
    branches: [main]
    paths-ignore: ['threat-model/**']
  # Allows workflow to be triggered manually from the Actions tab
  workflow_dispatch:

jobs:
  main:
    name: Build, Validate, and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Publish as W3C Technical Report Snapshot
        uses: w3c/spec-prod@v2
        if: ${{ github.ref_name == 'main' }}
        with:
          TOOLCHAIN: respec
          W3C_ECHIDNA_TOKEN: ${{ secrets.W3C_TR_TOKEN }}
          W3C_WG_DECISION_URL: https://www.w3.org/2017/vc/WG/Meetings/Minutes/2023-04-12-vcwg#resolution1
          W3C_BUILD_OVERRIDE: |
             shortName: vc-data-model-2.1
             specStatus: WD
